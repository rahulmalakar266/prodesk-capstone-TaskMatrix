<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="Helvetica,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1040" height="640" fill="#ffffff"/>
<text x="40" y="22" font-size="16" font-weight="bold" fill="#111">TaskMatrix – MongoDB ERD (5 collections)</text>
<rect x="40" y="230" width="250" height="166" rx="6" fill="#fff" stroke="#334155" stroke-width="1.5"/>
